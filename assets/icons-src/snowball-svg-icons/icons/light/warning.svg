<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="title-warning">
<title id="title-warning">Snowball — Atenção</title>
<defs>
  <linearGradient id="g-warning" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
    <stop stop-color="#8AF0FF"/><stop offset="0.5" stop-color="#18D8FF"/><stop offset="1" stop-color="#168CFF"/>
  </linearGradient>
</defs>
<style>
.primary{fill:none;stroke:#0B2A55;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.accent{fill:none;stroke:url(#g-warning);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.soft{fill:#E8F8FF;stroke:#0B2A55;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.accent-fill{fill:#18D8FF}
.primary-fill{fill:#0B2A55}
.primary-invert{fill:none;stroke:#FFFFFF;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
</style>
<path class="soft" d="M32 10l24 42H8z"/>
<path class="primary" d="M32 10l24 42H8z"/>
<path class="accent" d="M32 24v13"/>
<circle class="accent-fill" cx="32" cy="44" r="2.3"/>
</svg>